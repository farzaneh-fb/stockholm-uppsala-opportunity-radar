    Personal Statement:
    - "Interdisciplinary researcher combining bioinformatics, genomics and molecular
      biology, with hands-on experience in sequencing workflows, cell culture and
      translational research. I use R, Python, Linux and reproducible pipelines to
      analyze high-dimensional biological data, including single-cell RNA-seq and
      spatial transcriptomics, and I am motivated to investigate how gene-regulatory
      programs and tissue context shape developmental disease mechanisms."

