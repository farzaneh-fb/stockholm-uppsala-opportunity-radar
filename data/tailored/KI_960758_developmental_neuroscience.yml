    Bioinformatics & Computational Biology Projects:
    - name: "Automated Raw Sequencing Data Quality Control Pipeline"
      highlights:
      - "Built an automated, parallelized Bash orchestration workflow designed for
        execution on High-Performance Computing (HPC) clusters via SLURM scheduling."
      - "Deployed FastQC and fastp dynamically inside isolated, version-controlled
        Singularity and Apptainer containers to automate raw sequence pairing, quality
        checking, and adapter trimming."
      - "Implemented multi-core processor allocation inside container runtimes to
        optimize throughput when executing string substitutions and batch file calculations."
      - "Orchestrated MultiQC container tasks to aggregate and output comprehensive
        data quality matrices, tracking processing adjustments across all sample cohorts
        simultaneously."
    - name: "Tumor Microenvironment Profiling: scRNA-Seq & Spatial Transcriptomics"
      highlights:
      - "Engineered end-to-end transcriptomic pipelines in R using Seurat and SCTransform
        to map high-dimensional gene expression across breast cancer tissue cohorts."
      - "Executed data pre-processing, Quality Control (QC), linear (PCA), and non-linear
        (t-SNE / UMAP) dimensionality reduction alongside graph-based clustering to
        resolve distinct cell populations and structural tissue features."
      - "Containerized both analysis environments using Docker and Docker Compose,
        ensuring full cross-platform compatibility and seamless runtime execution
        across varied infrastructure platforms."
      - "Managed pipeline documentation, software repositories, and strict workflow
        reproducibility utilizing Git and GitHub version control standards."

    Research Experience:
    - company: "Karolinska Institute & SciLifeLab"
      position: "Master's Thesis Research"
      date: "2026–present"
      highlights:
      - "Investigating replication-stress-induced genomic instability at common fragile
        sites using targeted long-read sequencing."
      - "Performing neuroblastoma cell culture, drug treatments, DNA extraction, and
        long-range PCR."
      - "Developed bioinformatics workflows using Python, Linux and HPC environments
        for long-read sequencing analysis."
      - "Performed structural variant discovery, breakpoint characterization and endogenous
        barcode identification."
    - company: "KTH Royal Institute of Technology & SciLifeLab"
