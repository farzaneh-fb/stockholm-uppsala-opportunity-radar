        screening."
      - "Optimized layer-by-layer cellulose nanofibril coatings to enhance cancer
        spheroid formation."
      - "Contributed to projects on Brain-on-a-Chip models for metabolic studies."
      - "Functionalized electrochemical sensors for ketone detection."
    - company: "Tehran University of Medical Sciences"
